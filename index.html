<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ConfiQuiz – Practice Sliders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --radius: 14px; --border: #e5e7eb; --muted: #6b7280; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin: 14px; color:#111827; background:#f9fafb; }
    .card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 6px 24px rgba(0,0,0,.06); padding:16px; max-width:640px; margin:0 auto; }
    h2 { font-size:18px; margin:0 0 6px; }
    .opts { line-height:1.6; margin:8px 0 14px; }
    .row { display:grid; grid-template-columns:28px 1fr 72px; gap:10px; align-items:center; margin:12px 0; }
    input[type="range"] { width:100%; }
    input[type="number"] { width:72px; padding:8px; border:1px solid var(--border); border-radius:8px; }
    button { padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:#f3f4f6; font-weight:600; cursor:pointer; }
    .actions { display:flex; gap:10px; margin-top:12px; flex-wrap: wrap; }
    pre { background:#f3f4f6; padding:8px; border-radius:8px; font-size:13px; }
    table { border-collapse:collapse; width:100%; margin-top:10px; font-size:14px; }
    th, td { border:1px solid #e5e7eb; padding:6px 8px; text-align:left; }
    th { background:#f3f4f6; }
  </style>
</head>
<body>

  <div class="card" id="quizCard">
    <h2 id="qtitle">ConfiQuiz</h2>
    <div id="qtext">Loading question…</div>
    <div id="opts" class="opts"></div>

    <div class="row"><div>A</div><input id="slider0" type="range" min="0" max="100"><input id="input0" type="number" min="0" max="100"></div>
    <div class="row"><div>B</div><input id="slider1" type="range" min="0" max="100"><input id="input1" type="number" min="0" max="100"></div>
    <div class="row"><div>C</div><input id="slider2" type="range" min="0" max="100"><input id="input2" type="number" min="0" max="100"></div>
    <div class="row"><div>D</div><input id="slider3" type="range" min="0" max="100"><input id="input3" type="number" min="0" max="100"></div>

    <div>Total: <span id="totalv">100</span>%</div>
    <div class="actions">
      <button id="submitBtn">Submit</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="resultBox"></div>
  </div>

  <div class="card" id="summaryCard" style="display:none;">
    <h2>📊 Your Results</h2>
    <div id="summaryBox"></div>
  </div>

  <script>
    let QUESTIONS = [];
    let quizSet = [];
    let currentValues = [25,25,25,25];
    let qIndex = 0;
    let results = [];

    const sliders = [0,1,2,3].map(i => document.getElementById('slider'+i));
    const inputs = [0,1,2,3].map(i => document.getElementById('input'+i));
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const qtext = document.getElementById('qtext');
    const optsEl = document.getElementById('opts');
    const totalv = document.getElementById('totalv');
    const resultBox = document.getElementById('resultBox');
    const quizCard = document.getElementById('quizCard');
    const summaryCard = document.getElementById('summaryCard');
    const summaryBox = document.getElementById('summaryBox');

    function clamp(x){ x=parseInt(x??0,10); return isFinite(x)?Math.max(0,Math.min(100,x)):0; }
    function escapeHTML(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function loadDB(){
      const res = await fetch('questions.json', { cache: 'no-store' });
      QUESTIONS = await res.json();
      quizSet = QUESTIONS.sort(() => 0.5 - Math.random()).slice(0, 5); // pick 5 random
    }

    function renderQuestion(q){
      qtext.innerHTML = `❓ <b>${escapeHTML(q.question)}</b>`;
      const labels = ['A','B','C','D'];
      optsEl.innerHTML = labels.map((L,i)=>`${L}. ${escapeHTML(q.options[i])}`).join('<br>');
      resultBox.innerHTML = '';
    }

    function syncInputs(){
      for(let i=0;i<4;i++){ sliders[i].value=currentValues[i]; inputs[i].value=currentValues[i]; }
      const total = currentValues.reduce((a,b)=>a+b,0);
      totalv.textContent = total;
      submitBtn.disabled = (total!==100);
    }

    function updateValue(i,v){ currentValues[i]=clamp(v); syncInputs(); }

    function scoreQuestion(correctIndex){
      const p = currentValues[correctIndex] / 100;
      if (p <= 0) return Infinity;
      return -Math.log(p);
    }

    function submitAnswer(){
      const total = currentValues.reduce((a,b)=>a+b,0);
      if(total!==100) return alert("Make sure total = 100%");
      const q = quizSet[qIndex];
      const score = scoreQuestion(q.correct);
      results.push({ question: q.question, correct: q.options[q.correct], userP: currentValues, score });

      qIndex++;
      if (qIndex < quizSet.length) {
        resultBox.innerHTML = `<b>✅ Recorded!</b> Next question coming...`;
        setTimeout(() => { renderQuestion(quizSet[qIndex]); resetAll(); }, 1000);
      } else {
        showSummary();
      }
    }

    function resetAll(){ currentValues=[25,25,25,25]; syncInputs(); }

    function showSummary(){
      quizCard.style.display = 'none';
      summaryCard.style.display = 'block';

      let totalScore = 0;
      let rows = results.map((r,i)=>{
        const scoreText = (r.score===Infinity) ? '∞' : r.score.toFixed(3);
        totalScore += (r.score===Infinity) ? 0 : r.score;
        return `<tr><td>${i+1}</td><td>${escapeHTML(r.question)}</td><td>${escapeHTML(r.correct)}</td><td>${scoreText}</td></tr>`;
      }).join('');

      const avg = results.every(r=>r.score===Infinity) ? '∞' :
        (totalScore / results.length).toFixed(3);

      summaryBox.innerHTML = `
        <table>
          <tr><th>#</th><th>Question</th><th>Correct Answer</th><th>Score</th></tr>
          ${rows}
        </table>
        <p><b>Average Score:</b> ${avg}</p>
        <button onclick="location.reload()">Restart</button>
      `;
    }

    sliders.forEach((s,i)=>s.addEventListener('input',e=>updateValue(i,e.target.value)));
    inputs.forEach((s,i)=>s.addEventListener('input',e=>updateValue(i,e.target.value)));
    submitBtn.addEventListener('click',submitAnswer);
    resetBtn.addEventListener('click',resetAll);

    (async function init(){ await loadDB(); renderQuestion(quizSet[0]); resetAll(); })();
  </script>
</body>
</html>
